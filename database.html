<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CorreoSeguro | Base de datos</title>
	<style>
		:root { --ink: #18221d; --muted: #68746b; --paper: #f5f7f1; --panel: #fff; --line: #dce4da; --green: #197653; --dark: #10563b; --yellow: #f5c85b; --red: #b84d45; }
		* { box-sizing: border-box; }
		body { margin: 0; color: var(--ink); background: radial-gradient(circle at 90% 0%, rgba(245, 200, 91, .2), transparent 25%), var(--paper); font-family: 'Trebuchet MS', sans-serif; }
		.page { width: min(1180px, calc(100% - 36px)); margin: auto; padding: 35px 0 55px; }
		header { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 30px; }
		.eyebrow { margin: 0 0 8px; color: var(--green); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
		h1, h2 { font-family: Georgia, serif; font-weight: 400; }
		h1 { margin: 0; font-size: clamp(32px, 5vw, 52px); }
		header p:last-child { margin: 9px 0 0; color: var(--muted); font-size: 13px; }
		.actions { display: flex; gap: 10px; }
		button { padding: 11px 15px; border: 0; color: white; background: var(--green); cursor: pointer; font: 700 12px 'Trebuchet MS', sans-serif; }
		button:hover { background: var(--dark); }
		button.secondary { color: var(--green); border: 1px solid var(--line); background: var(--panel); }
		button.danger { padding: 7px 10px; color: var(--red); border: 1px solid #f0c8c2; background: #fff7f5; font-size: 10px; }
		button.danger:hover { color: white; background: var(--red); }
		.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
		.metric, .table-panel { border: 1px solid var(--line); background: var(--panel); box-shadow: 0 15px 40px rgba(30, 60, 42, .07); }
		.metric { padding: 19px 20px; }
		.metric span { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
		.metric strong { display: block; margin-top: 10px; color: var(--dark); font: 400 31px Georgia, serif; }
		.tables { display: grid; gap: 20px; }
		.table-panel { overflow: hidden; }
		.panel-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
		.panel-heading h2 { margin: 0; font-size: 22px; }
		.panel-heading span { color: var(--muted); font-size: 11px; }
		.table-wrap { overflow-x: auto; }
		table { width: 100%; border-collapse: collapse; min-width: 620px; font-size: 12px; }
		th, td { padding: 13px 18px; border-bottom: 1px solid #edf1eb; text-align: left; white-space: nowrap; }
		th { color: var(--muted); background: #fbfcf9; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
		tbody tr:last-child td { border-bottom: 0; }
		.badge { display: inline-block; padding: 5px 8px; color: var(--dark); background: #e5f3e6; font-size: 10px; font-weight: 700; }
		.badge.pending { color: #8c6410; background: #fff4d4; }
		.empty, #error { padding: 24px 20px; color: var(--muted); font-size: 13px; }
		#error { color: var(--red); background: #fff0ed; }
		@media (max-width: 700px) { .page { width: min(100% - 24px, 560px); padding-top: 22px; } header { align-items: flex-start; flex-direction: column; } .summary { grid-template-columns: repeat(2, 1fr); } }
	</style>
</head>
<body>
	<main class="page">
		<header><div><p class="eyebrow">Panel local</p><h1>Base de datos</h1><p>Consulta visual de los datos guardados en SQLite.</p></div><div class="actions"><button class="secondary" type="button" onclick="location.href='index.html'">Volver a la tienda</button><button type="button" id="refresh">Actualizar</button></div></header>
		<section class="summary" aria-label="Resumen de la base de datos">
			<div class="metric"><span>Usuarios</span><strong id="users-count">-</strong></div><div class="metric"><span>Pagos</span><strong id="payments-count">-</strong></div><div class="metric"><span>Sesiones activas</span><strong id="sessions-count">-</strong></div><div class="metric"><span>Verificaciones pendientes</span><strong id="verifications-count">-</strong></div>
		</section>
		<p id="error" hidden></p>
		<div class="tables" id="tables"></div>
	</main>
	<script>
		const labels = { users: ['Usuarios', ['ID', 'Nombre', 'Correo', 'Verificado', 'Creado', 'Acción']], payments: ['Pagos', ['ID', 'Usuario', 'Importe', 'Método', 'Estado', 'Referencia', 'Fecha', 'Acción']], sessions: ['Sesiones activas', ['Usuario', 'Correo', 'Expira', 'Acción']], verifications: ['Verificaciones pendientes', ['Correo', 'Expira']] };
		const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
		const formatDate = (value) => value ? new Date(value.replace(' ', 'T') + (value.includes('Z') ? '' : 'Z')).toLocaleString('es-ES') : '-';
		const renderTable = (key, rows) => {
			const [title, columns] = labels[key];
			if (!rows.length) return `<section class="table-panel"><div class="panel-heading"><h2>${title}</h2><span>0 registros</span></div><div class="empty">No hay datos en esta tabla.</div></section>`;
			const cells = rows.map((row) => {
				const values = key === 'users'
					? [row.id, row.name, row.email, row.verified ? '<span class="badge">Sí</span>' : '<span class="badge pending">No</span>', formatDate(row.created_at), `<button class="danger" type="button" data-delete-user="${row.id}">Borrar</button>`]
					: key === 'payments'
						? [row.id, row.email, (row.amount_cents / 100).toFixed(2) + ' ' + row.currency, escapeHtml(row.payment_method === 'legacy' ? 'Anterior' : row.payment_method === 'bizum' ? 'Bizum' : 'PayPal'), `<span class="badge">${escapeHtml(row.status)}</span>`, row.provider_reference, formatDate(row.created_at), `<button class="danger" type="button" data-delete-payment="${row.id}">Eliminar</button>`]
						: key === 'sessions'
							? [row.user_id, row.email, formatDate(row.expires_at), `<button class="danger" type="button" data-delete-session="${row.session_id}">Cerrar sesión</button>`]
							: [row.email, formatDate(row.expires_at)];
				return `<tr>${values.map((value) => `<td>${typeof value === 'string' && (value.includes('<span') || value.includes('<button')) ? value : escapeHtml(value)}</td>`).join('')}</tr>`;
			}).join('');
			return `<section class="table-panel"><div class="panel-heading"><h2>${title}</h2><span>${rows.length} registro${rows.length === 1 ? '' : 's'}</span></div><div class="table-wrap"><table><thead><tr>${columns.map((column) => `<th>${column}</th>`).join('')}</tr></thead><tbody>${cells}</tbody></table></div></section>`;
		};
		async function removeRecord(url, message) { if (!confirm(message)) return; const response = await fetch(url, { method: 'DELETE' }); const data = await response.json(); if (!response.ok) throw new Error(data.error); await loadDatabase(); }
		async function loadDatabase() { const error = document.getElementById('error'); error.hidden = true; try { const response = await fetch('/api/database'); const data = await response.json(); if (!response.ok) throw new Error(data.error); Object.keys(labels).forEach((key) => document.getElementById(key + '-count').textContent = data[key].length); document.getElementById('tables').innerHTML = Object.keys(labels).map((key) => renderTable(key, data[key])).join(''); document.querySelectorAll('[data-delete-user]').forEach((button) => button.addEventListener('click', () => removeRecord('/api/database/users/' + button.dataset.deleteUser, '¿Borrar este usuario y todos sus pagos, verificaciones y sesiones?').catch(showError))); document.querySelectorAll('[data-delete-session]').forEach((button) => button.addEventListener('click', () => removeRecord('/api/database/sessions/' + button.dataset.deleteSession, '¿Cerrar esta sesión activa?').catch(showError))); document.querySelectorAll('[data-delete-payment]').forEach((button) => button.addEventListener('click', () => removeRecord('/api/database/payments/' + button.dataset.deletePayment, '¿Eliminar este pago? Esta acción no se puede deshacer.').catch(showError))); } catch (requestError) { showError(requestError); } }
		function showError(requestError) { const error = document.getElementById('error'); error.textContent = requestError.message || 'No se pudo cargar la base de datos.'; error.hidden = false; }
		document.getElementById('refresh').addEventListener('click', loadDatabase); loadDatabase();
	</script>
</body>
</html>
